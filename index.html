function resize(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const make=(max,q)=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);return c.toDataURL("image/jpeg",q)};res({full:make(1080,.70),thumb:make(180,.55)})};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function openDetail(id){const e=entries.find(x=>x.id===id);if(!e)return;detailId=id;const has=!!e.hasImage;r.dmedia.classList.toggle("hidden",!has);r.dmedia.classList.toggle("loading",has);r.dimg.removeAttribute("src");r.dtitle.textContent=e.title||"(제목 없음)";r.dbody.textContent=e.body||"";r.ddate.textContent=fmt(e.createdAt);r.dtags.innerHTML="";entryTags(e).forEach(tag=>{const s=document.createElement("span");s.className="detailtag"+(tag==="명예의전당"?" hall":"");s.textContent=tag;r.dtags.appendChild(s)});r.detail.classList.remove("hidden");r.detail.scrollTop=0;document.body.style.overflow="hidden";if(has)loadEntryImage(e).then(img=>{if(detailId!==id)return;r.dmedia.classList.remove("loading");r.dmedia.classList.toggle("hidden",!img);if(img){r.dimg.src=img;r.dimg.alt=e.title||""}}).catch(()=>{if(detailId===id){r.dmedia.classList.remove("loading");r.dmedia.classList.add("hidden")}})}
