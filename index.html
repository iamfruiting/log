<style>
@font-face{font-family:'Cafe24SsurroundAir';src:url('https://cdn.jsdelivr.net/gh/sweetherofonts/fontshero_pack1/cafe24ssurroundair/cafe24ssurroundair-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}

:root{--bg:#EBE4D2;--ink:#28180B;--brick:#772A18;--mustard:#8A7728;--blue:#85A0B1;--brown:#522512;--line:rgba(40,24,11,.16);--max:980px}

.panel{position:fixed;inset:0;z-index:50;width:100%;max-width:100%;overflow-y:auto;overflow-x:hidden;background:var(--bg)}

.panelhead strong{text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panelhead button{width:48px;min-height:48px;border:0;background:transparent;color:var(--ink);padding:0;font-size:13px}
.panelhead .back{font-size:24px;text-align:left}
.panelhead #cancelBtn{color:var(--blue);text-align:left}
.fruit-action{display:grid!important;place-items:center!important;padding:0!important}
.fruit-action .fruit-icon{width:18px;height:22px}
.fruit-action.saving{opacity:.45;pointer-events:none}
.detail,.editor{width:100%;max-width:720px;margin:0 auto;padding:20px 14px calc(44px + env(safe-area-inset-bottom));overflow-x:hidden}
.detailmedia{width:100%;margin:0 0 26px}.detailmedia img{display:block;width:100%;max-height:72vh;object-fit:contain}.detailmedia.loading{min-height:160px;display:grid;place-items:center}.detailmedia.loading::after{content:"";width:9px;height:11px;background:var(--mustard);border-radius:38% 46% 42% 48% / 44% 41% 53% 50%;transform:rotate(10deg);opacity:.45}.detailmedia.loading img{display:none}
.detail h2{font-size:27px;line-height:1.24;letter-spacing:-.04em;margin:0}.detailbody{margin-top:20px;font-size:15px;line-height:1.8;white-space:pre-wrap}.detaildate{margin-top:34px;font-size:11px;color:var(--brown)}.detailtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.detailtag{border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--brown);font-family:"DearFromsol","Cafe24SsurroundAir",sans-serif;font-size:12px}.detailtag.hall{color:var(--brick);border-color:rgba(119,42,24,.55)}.detailactions{margin-top:26px}.detailactions button{border:0;background:transparent;color:var(--brown);padding:4px 0;font-size:12px}
.imagebox{position:relative;width:100%;height:170px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--brown);overflow:hidden;margin:0 0 26px;background:transparent;cursor:pointer}
.imagebox.has{height:auto;min-height:0;border-style:solid}.imagebox img{display:block;width:100%;max-height:55vh;object-fit:contain}.imagebox input{display:none}.imagehint{font-size:28px;font-weight:300;line-height:1;color:var(--brown)}
.removeimg{position:absolute;right:8px;top:8px;width:34px!important;height:34px!important;min-height:34px!important;border:0!important;border-radius:50%!important;background:rgba(40,24,11,.78)!important;color:var(--bg)!important;font-size:19px!important;z-index:2}
.field{width:100%;margin-bottom:22px}.field label{display:block;font-size:11px;color:var(--brown);margin-bottom:7px}.field input,.field textarea{display:block;width:100%;max-width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;outline:none;padding:10px 0 12px;color:var(--ink)}.field input{font-size:18px;font-weight:620}.field textarea{min-height:165px;resize:vertical;font-size:15px;line-height:1.75}
.category-picker{width:100%;border:1px solid var(--line);padding:10px;border-radius:10px}.category-selected{display:flex;flex-wrap:wrap;gap:6px}.category-selected:not(:empty){margin-bottom:8px}.selected-pill{display:inline-flex;align-items:center;gap:6px;background:var(--mustard);color:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;font-family:"DearFromsol","Cafe24SsurroundAir",sans-serif}.selected-pill.hall{background:var(--brick)}.selected-pill button{border:0;background:transparent;color:inherit;padding:0;font-size:15px}.category-create{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.category-create input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:13px}.category-create button{border:0;background:var(--brick);color:var(--bg);border-radius:999px;padding:6px 11px;font-size:11px}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.suggestions button{border:1px solid var(--line);background:transparent;color:var(--brown);border-radius:999px;padding:4px 10px;font-size:12px;font-family:"DearFromsol","Cafe24SsurroundAir",sans-serif}.suggestions button.active{background:var(--mustard);color:var(--bg);border-color:transparent}.suggestions button.hall{border-color:rgba(119,42,24,.55);color:var(--brick)}.suggestions button.hall.active{background:var(--brick);color:var(--bg)}
.danger{width:100%;margin-top:24px;border:1px solid rgba(119,42,24,.28);background:transparent;color:var(--brick);padding:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:200;transform:translate(-50%,12px);opacity:0;max-width:calc(100vw - 28px);background:var(--brown);color:var(--bg);padding:10px 14px;border-radius:999px;font-size:12px;transition:.18s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}
.lockscreen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}.lockcard{width:min(320px,100%);text-align:center}.lockmark{display:inline-block;width:28px;height:34px;background:var(--brick);border-radius:38% 46% 42% 48% / 44% 41% 53% 50%;transform:rotate(10deg);margin-bottom:18px}.locktitle{font-family:"Darumadrop One",sans-serif;font-size:28px;margin:0 0 18px;font-weight:400}.lockrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.lockrow input{width:100%;min-height:44px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 2px;font-size:16px;outline:none;text-align:center}.lockrow button{min-height:44px;border:0;background:var(--mustard);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:12px;font-weight:400}.lockmsg{min-height:18px;margin-top:10px;font-size:11px;color:var(--brown)}
@media(min-width:700px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}main{padding-left:14px;padding-right:14px}.top,.categories,.viewbar,.footcount{padding-left:22px;padding-right:22px}}
@media(min-width:980px){.gallery{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="brand"><h1>i am fruiting.</h1></div><button type="button" class="add" id="addBtn" aria-label="새 기록"><span class="fruit-icon"></span></button></div></header>
<nav class="categories" id="categories"></nav>
<div class="viewbar"><div class="viewtoggle"><button id="galleryMode" class="active">IMAGE</button><span class="slash">/</span><button id="boardMode">TEXT</button></div></div>
<main><section class="empty hidden" id="empty"><strong>아직 기록이 없어요.</strong><p>사진이 있어도, 없어도 괜찮아요. 자꾸 마음에 남는 것을 하나씩 모아보세요.</p><button id="emptyAdd">첫 기록 남기기</button></section><section class="gallery" id="gallery"></section><section class="board hidden" id="board"></section></main>
<div class="footcount"><span id="countLabel">0개의 단서 발견!</span></div>
</div>

<section class="panel hidden" id="detailPanel"><header class="panelhead"><button class="back" id="backBtn">‹</button><strong></strong><button type="button" class="fruit-action edit-fruit" id="editBtn" aria-label="수정"><span class="fruit-icon"></span></button></header><article class="detail"><div class="detailmedia hidden" id="detailMedia"><img id="detailImage" alt=""></div><h2 id="detailTitle"></h2><div class="detailbody" id="detailBody"></div><div class="detaildate" id="detailDate"></div><div class="detailtags" id="detailTags"></div><div class="detailactions"><button id="detailDelete">삭제</button></div></article></section>

<form class="panel hidden" id="editorPanel"><header class="panelhead"><button type="button" id="cancelBtn">취소</button><strong id="editorTitle">새 기록</strong><button type="submit" class="fruit-action" id="saveBtn" aria-label="저장"><span class="fruit-icon"></span></button></header><div class="editor"><div class="imagebox" id="imageBox"><span class="imagehint" id="imageHint">+</span><img class="hidden" id="imagePreview" alt="선택한 사진"><button class="removeimg hidden" type="button" id="removeImg">×</button><input type="file" id="imageInput" accept="image/*"></div><div class="field"><label for="titleInput">제목</label><input id="titleInput" maxlength="120" placeholder="제목을 적어주세요"></div><div class="field"><label for="bodyInput">내용</label><textarea id="bodyInput" placeholder="왜 마음에 남았는지, 무엇이 좋았는지"></textarea></div><div class="field"><label>태그</label><div class="category-picker"><div class="category-selected" id="categorySelected"></div><div class="category-create"><input id="categoryInput" maxlength="40" placeholder="새 태그 입력"><button type="button" id="addCategoryBtn">추가</button></div><div class="suggestions" id="suggestions"></div></div></div><button class="danger hidden" type="button" id="editorDelete">이 기록 삭제</button></div></form>

<section class="lockscreen" id="lockScreen"><form class="lockcard" id="lockForm"><span class="lockmark"></span><h2 class="locktitle">i am fruiting.</h2><div class="lockrow"><input id="pinInput" type="password" autocomplete="current-password" placeholder="PIN"><button type="submit" id="pinBtn">ENTER</button></div><div class="lockmsg" id="lockMsg"></div></form></section>
<div class="toast" id="toast"></div>

<script>
(()=>{"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbyT3JtTtRwRHe5NRzbr3FXwHz59koQEhv1HnKl5730zaNA3qb8WmUMETv8IJBwx-0HY/exec";
const PIN_KEY="fruiting_archive_pin_v1",CACHE_KEY="fruiting_entries_v3",THUMB_KEY="fruiting_thumbs_v3";
let apiPin=localStorage.getItem(PIN_KEY)||"",entries=[],view="gallery",category="전체",detailId=null,editingId=null,pendingImage="",pendingThumb="",imageDirty=false,editingHadImage=false,selectedTags=[],thumbQueue=new Set(),thumbTimer=null;
const $=s=>document.querySelector(s);
const r={add:$("#addBtn"),emptyAdd:$("#emptyAdd"),cats:$("#categories"),gallery:$("#gallery"),board:$("#board"),empty:$("#empty"),gmode:$("#galleryMode"),bmode:$("#boardMode"),count:$("#countLabel"),detail:$("#detailPanel"),back:$("#backBtn"),dmedia:$("#detailMedia"),dimg:$("#detailImage"),dtitle:$("#detailTitle"),dbody:$("#detailBody"),ddate:$("#detailDate"),dtags:$("#detailTags"),edit:$("#editBtn"),ddel:$("#detailDelete"),editor:$("#editorPanel"),editorTitle:$("#editorTitle"),cancel:$("#cancelBtn"),save:$("#saveBtn"),ibox:$("#imageBox"),ihint:$("#imageHint"),ipreview:$("#imagePreview"),iinput:$("#imageInput"),iremove:$("#removeImg"),title:$("#titleInput"),body:$("#bodyInput"),catInput:$("#categoryInput"),catSelected:$("#categorySelected"),addCat:$("#addCategoryBtn"),suggestions:$("#suggestions"),edel:$("#editorDelete"),toast:$("#toast")};
const lockScreen=$("#lockScreen"),lockForm=$("#lockForm"),pinInput=$("#pinInput"),pinBtn=$("#pinBtn"),lockMsg=$("#lockMsg");
function toast(t){r.toast.textContent=t;r.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>r.toast.classList.remove("show"),1500)}
function jsonp(params){return new Promise((resolve,reject)=>{const cb="__fr_"+Date.now()+Math.random().toString(36).slice(2),sc=document.createElement("script");let tm;const clean=()=>{clearTimeout(tm);delete window[cb];sc.remove()};window[cb]=d=>{clean();if(!d||d.ok===false)reject(new Error(d?.error||"연결 오류"));else resolve(d)};sc.onerror=()=>{clean();reject(new Error("구글 저장소에 연결하지 못했어요"))};sc.src=API_URL+"?"+new URLSearchParams({...params,callback:cb});document.head.appendChild(sc);tm=setTimeout(()=>{clean();reject(new Error("연결 시간이 초과됐어요"))},15000)})}
async function apiPost(payload){const body=new URLSearchParams();body.set("payload",JSON.stringify({pin:apiPin,...payload}));await fetch(API_URL,{method:"POST",mode:"no-cors",body,cache:"no-store",credentials:"omit"})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const fmt=ts=>{const d=new Date(Number(ts)||Date.now());return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`};
const entryTags=e=>Array.isArray(e.tags)&&e.tags.length?e.tags:["미분류"];
function cacheEntries(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(entries.slice(0,120)))}catch(e){}}
function loadEntries(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||"[]")||[]}catch{return []}}
function loadThumbMap(){try{return JSON.parse(localStorage.getItem(THUMB_KEY)||"{}")||{}}catch{return {}}}
function saveThumbMap(map){try{localStorage.setItem(THUMB_KEY,JSON.stringify(map))}catch(e){}}
function cacheThumb(id,thumb){if(!id||!thumb)return;const m=loadThumbMap();m[id]=thumb;const keys=Object.keys(m);if(keys.length>80)keys.slice(0,keys.length-80).forEach(k=>delete m[k]);saveThumbMap(m)}
function hydrateThumbs(list){const m=loadThumbMap();list.forEach(e=>{if(!e.thumb&&m[e.id])e.thumb=m[e.id];if(e.thumb)cacheThumb(e.id,e.thumb)})}
async function refresh(){const x=await jsonp({action:"list",pin:apiPin});entries=x.entries||[];hydrateThumbs(entries);cacheEntries();renderAll()}
function cats(){const s=new Set();entries.forEach(e=>entryTags(e).forEach(t=>s.add(t)));return [...s].sort((a,b)=>a.localeCompare(b,"ko"))}
function filtered(){return category==="전체"?entries:entries.filter(e=>entryTags(e).includes(category))}
function renderCats(){r.cats.innerHTML="";["전체",...cats()].forEach(c=>{const b=document.createElement("button");b.type="button";b.className="cat"+(c===category?" active":"")+(c==="명예의전당"?" hall":"");b.textContent=c;b.onclick=()=>{category=c;renderCats();renderContent()};r.cats.appendChild(b)})}
function sizeText(el){const n=(el.textContent||"").length;el.style.fontSize=(n<8?"clamp(20px,6.8vw,42px)":n<18?"clamp(17px,5.2vw,31px)":"clamp(14px,4.2vw,24px)")}
function setCardImage(card,e,img){if(!img)return;card.innerHTML="";const i=document.createElement("img");i.src=img;i.alt=e.title||"";i.loading="eager";i.decoding="async";i.onerror=()=>{card.innerHTML='<div class="imageplaceholder"></div>'};card.appendChild(i)}
function queueThumb(id){thumbQueue.add(id);clearTimeout(thumbTimer);thumbTimer=setTimeout(flushThumbs,35)}
async function flushThumbs(){const ids=[...thumbQueue].slice(0,18);ids.forEach(id=>thumbQueue.delete(id));if(!ids.length)return;try{const x=await jsonp({action:"thumbs",pin:apiPin,ids:ids.join(",")});const map=x.thumbs||{};let changed=false;entries.forEach(e=>{if(map[e.id]){e.thumb=map[e.id];cacheThumb(e.id,map[e.id]);changed=true}});if(changed){cacheEntries();renderContent()}}catch(e){}if(thumbQueue.size)thumbTimer=setTimeout(flushThumbs,60)}
function renderContent(){const list=filtered();r.count.textContent=`${list.length}개의 단서 발견!`;r.empty.classList.toggle("hidden",entries.length!==0);r.gallery.classList.toggle("hidden",view!=="gallery"||entries.length===0);r.board.classList.toggle("hidden",view!=="board"||entries.length===0);r.gallery.innerHTML="";r.board.innerHTML="";let ti=0;const tones=["tone-dark","tone-brick","tone-mustard","tone-blue","tone-brown"];list.forEach((e,idx)=>{const c=document.createElement("button");c.type="button";c.className="card";c.onclick=()=>openDetail(e.id);if(e.thumb)setCardImage(c,e,e.thumb);else if(e.hasImage){c.innerHTML='<div class="imageplaceholder"></div>';if(idx<24)queueThumb(e.id)}else{const t=document.createElement("div");t.className=`textcard ${tones[ti++%tones.length]}`;t.textContent=e.title||e.body||"제목 없음";c.appendChild(t);requestAnimationFrame(()=>sizeText(t))}r.gallery.appendChild(c);const row=document.createElement("button");row.type="button";row.className="boardrow";row.innerHTML=`<span class="boardtitle"></span><span class="boardexcerpt"></span>`;row.children[0].textContent=e.title||"(제목 없음)";row.children[1].textContent=e.body||"";row.onclick=()=>openDetail(e.id);r.board.appendChild(row)})}
function renderAll(){renderCats();renderContent()}
async function loadImage(e){if(e.image)return e.image;const x=await jsonp({action:"image",pin:apiPin,id:e.id});e.image=x.image||"";return e.image}
function openDetail(id){const e=entries.find(x=>x.id===id);if(!e)return;detailId=id;r.dtitle.textContent=e.title||"(제목 없음)";r.dbody.textContent=e.body||"";r.ddate.textContent=fmt(e.createdAt);r.dtags.innerHTML="";entryTags(e).forEach(tag=>{const s=document.createElement("span");s.className="detailtag"+(tag==="명예의전당"?" hall":"");s.textContent=tag;r.dtags.appendChild(s)});r.dimg.removeAttribute("src");r.dmedia.classList.toggle("hidden",!e.hasImage);r.dmedia.classList.toggle("loading",!!e.hasImage);r.detail.classList.remove("hidden");r.detail.scrollTop=0;document.body.style.overflow="hidden";if(e.hasImage)loadImage(e).then(img=>{if(detailId!==id)return;r.dmedia.classList.remove("loading");r.dmedia.classList.toggle("hidden",!img);if(img)r.dimg.src=img}).catch(()=>{r.dmedia.classList.remove("loading");r.dmedia.classList.add("hidden")})}
function closeDetail(){r.detail.classList.add("hidden");r.dmedia.classList.remove("loading");detailId=null;document.body.style.overflow=""}
function updatePreview(){const yes=!!pendingImage;r.ibox.classList.toggle("has",yes);r.ihint.classList.toggle("hidden",yes);r.ipreview.classList.toggle("hidden",!yes);r.iremove.classList.toggle("hidden",!yes);if(yes)r.ipreview.src=pendingImage;else r.ipreview.removeAttribute("src")}
function renderSelected(){r.catSelected.innerHTML="";selectedTags.forEach(tag=>{const p=document.createElement("span");p.className="selected-pill"+(tag==="명예의전당"?" hall":"");const n=document.createElement("span");n.textContent=tag;const b=document.createElement("button");b.type="button";b.textContent="×";b.onclick=()=>{selectedTags=selectedTags.filter(x=>x!==tag);renderSelected();renderSuggestions()};p.append(n,b);r.catSelected.appendChild(p)})}
function renderSuggestions(){r.suggestions.innerHTML="";cats().forEach(tag=>{const b=document.createElement("button");b.type="button";b.textContent=tag;b.className=(selectedTags.includes(tag)?"active ":"")+(tag==="명예의전당"?"hall":"");b.onclick=()=>{selectedTags=selectedTags.includes(tag)?selectedTags.filter(x=>x!==tag):[...selectedTags,tag];renderSelected();renderSuggestions()};r.suggestions.appendChild(b)})}
function addTag(){const t=r.catInput.value.trim();if(!t)return;if(!selectedTags.includes(t))selectedTags.push(t);r.catInput.value="";renderSelected();renderSuggestions()}
function openEditor(id=null){editingId=id;pendingImage="";pendingThumb="";imageDirty=false;editingHadImage=false;selectedTags=[];r.title.value="";r.body.value="";r.catInput.value="";r.iinput.value="";r.edel.classList.add("hidden");let e=null;if(id){e=entries.find(x=>x.id===id);if(!e)return;r.editorTitle.textContent="기록 수정";r.title.value=e.title||"";r.body.value=e.body||"";selectedTags=[...entryTags(e)];editingHadImage=!!e.hasImage;r.edel.classList.remove("hidden")}else r.editorTitle.textContent="새 기록";updatePreview();renderSelected();renderSuggestions();r.editor.classList.remove("hidden");r.editor.scrollTop=0;document.body.style.overflow="hidden";if(e&&e.hasImage)loadImage(e).then(img=>{if(editingId===id&&!imageDirty&&img){pendingImage=img;updatePreview()}}).catch(()=>{})}
function closeEditor(){r.editor.classList.add("hidden");editingId=null;pendingImage="";pendingThumb="";imageDirty=false;editingHadImage=false;selectedTags=[];r.iinput.value="";document.body.style.overflow=r.detail.classList.contains("hidden")?"":"hidden"}
function resize(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const make=(max,q)=>{let w=img.naturalWidth,h=img.naturalHeight;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k))}const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d",{alpha:false});ctx.drawImage(img,0,0,w,h);return c.toDataURL("image/jpeg",q)};resolve({full:make(960,.68),thumb:make(128,.48)})};img.onerror=reject;img.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
async function save(){if(r.save.disabled)return;const title=r.title.value.trim(),body=r.body.value.trim(),typed=r.catInput.value.trim();if(!title){toast("제목을 적어주세요");r.title.focus();return}if(typed&&!selectedTags.includes(typed))selectedTags.push(typed);const tags=selectedTags.length?[...selectedTags]:["미분류"],old=editingId?entries.find(e=>e.id===editingId):null,now=Date.now(),id=old?.id||uid();let imageMode="keep";if(!old)imageMode=pendingImage?"replace":"clear";else if(imageDirty)imageMode=pendingImage?"replace":"clear";const optimistic={id,title,body,tags,category:tags[0],sourceType:"photo",link:"",photoLink:old?.photoLink||"",hasImage:imageMode==="replace"?true:imageMode==="clear"?false:!!old?.hasImage,thumb:imageMode==="replace"?pendingThumb||"":imageMode==="clear"?"":old?.thumb||"",createdAt:old?.createdAt||now,updatedAt:now};r.save.disabled=true;r.save.classList.add("saving");toast("저장 중…");try{await apiPost({action:"save",entry:optimistic,imageMode,full:imageMode==="replace"?pendingImage:"",thumb:imageMode==="replace"?pendingThumb:""});const i=entries.findIndex(e=>e.id===id);if(i>=0)entries[i]=optimistic;else entries.unshift(optimistic);if(optimistic.thumb)cacheThumb(id,optimistic.thumb);cacheEntries();closeEditor();renderAll();window.scrollTo(0,0);toast(old?"수정했어요":"저장했어요");setTimeout(()=>refresh().catch(()=>{}),250)}catch(err){toast("저장하지 못했어요");console.error(err)}finally{r.save.disabled=false;r.save.classList.remove("saving")}}
async function remove(id){if(!id||!confirm("이 기록을 삭제할까요?"))return;await apiPost({action:"delete",id});entries=entries.filter(e=>e.id!==id);cacheEntries();closeEditor();closeDetail();renderAll();toast("삭제했어요");setTimeout(()=>refresh().catch(()=>{}),250)}
r.add.onclick=()=>openEditor();r.emptyAdd.onclick=()=>openEditor();r.gmode.onclick=()=>{view="gallery";r.gmode.classList.add("active");r.bmode.classList.remove("active");renderContent()};r.bmode.onclick=()=>{view="board";r.bmode.classList.add("active");r.gmode.classList.remove("active");renderContent()};r.back.onclick=closeDetail;r.edit.onclick=()=>detailId&&openEditor(detailId);r.ddel.onclick=()=>remove(detailId);r.cancel.onclick=closeEditor;r.editor.addEventListener("submit",e=>{e.preventDefault();save()});r.edel.onclick=()=>remove(editingId);r.ibox.onclick=e=>{if(e.target!==r.iremove)r.iinput.click()};r.iinput.onchange=async()=>{const f=r.iinput.files?.[0];if(!f)return;toast("사진 준비 중…");try{const x=await resize(f);pendingImage=x.full;pendingThumb=x.thumb;imageDirty=true;updatePreview()}catch(e){toast("이미지를 불러오지 못했어요")}};r.iremove.onclick=e=>{e.stopPropagation();pendingImage="";pendingThumb="";imageDirty=true;r.iinput.value="";updatePreview()};r.addCat.onclick=addTag;r.catInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addTag()}};
async function unlock(){const pin=pinInput.value.trim();if(!pin){lockMsg.textContent="PIN을 입력해주세요";return}if(pinBtn.disabled)return;pinBtn.disabled=true;lockMsg.textContent="확인 중…";apiPin=pin;try{await jsonp({action:"auth",pin:apiPin});localStorage.setItem(PIN_KEY,pin);lockMsg.textContent="";lockScreen.classList.add("hidden");const c=loadEntries();if(c.length){entries=c;hydrateThumbs(entries);renderAll()}await refresh()}catch(err){apiPin="";localStorage.removeItem(PIN_KEY);lockMsg.textContent=err.message||"PIN을 확인해주세요"}finally{pinBtn.disabled=false}}
lockForm.addEventListener("submit",e=>{e.preventDefault();unlock()});
async function boot(){if(apiPin){lockScreen.classList.add("hidden");const c=loadEntries();if(c.length){entries=c;hydrateThumbs(entries);renderAll()}try{await refresh()}catch(e){localStorage.removeItem(PIN_KEY);apiPin="";lockScreen.classList.remove("hidden");lockMsg.textContent="PIN을 다시 입력해주세요"}}else{lockScreen.classList.remove("hidden");setTimeout(()=>pinInput.focus(),80)}}
boot();
})();
</script>
