<script>
(()=>{"use strict";

const lockScreen=$("#lockScreen"),pinInput=$("#pinInput"),pinBtn=$("#pinBtn"),lockMsg=$("#lockMsg");
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function jsonp(params){return new Promise((resolve,reject)=>{const cb="__fruiting_cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);const sc=document.createElement("script");let timer;const clean=()=>{clearTimeout(timer);delete window[cb];sc.remove()};window[cb]=data=>{clean();if(!data||data.ok===false)reject(new Error(data?.error||"연결 오류"));else resolve(data)};sc.onerror=()=>{clean();reject(new Error("구글 저장소에 연결하지 못했어요"))};const q=new URLSearchParams({...params,callback:cb});sc.src=API_URL+"?"+q.toString();document.head.appendChild(sc);timer=setTimeout(()=>{clean();reject(new Error("연결 시간이 초과됐어요"))},15000)})}

const IMAGE_UPLOAD_CHUNK=44000;
async function apiPost(action,data){
  const body=new URLSearchParams();
  body.set("payload",JSON.stringify({action,pin:apiPin,...data}));
  await fetch(API_URL,{method:"POST",mode:"no-cors",body,cache:"no-store",credentials:"omit"});

async function apiSaveEntry(x,imageMode="replace"){
  const image=String(x.image||"");
  const meta={...x,image:""};
  await apiPost("saveMeta",{entry:meta});
  if(imageMode==="replace"){
    if(!image)throw new Error("저장할 사진 데이터가 없습니다.");
    await apiPost("imageBegin",{id:x.id});
    const total=Math.ceil(image.length/IMAGE_UPLOAD_CHUNK);
    for(let i=0,index=0;i<image.length;i+=IMAGE_UPLOAD_CHUNK,index++){
      await apiPost("imageChunk",{id:x.id,index,data:image.slice(i,i+IMAGE_UPLOAD_CHUNK)});
    }
    await apiPost("imageFinish",{id:x.id,totalChunks:total});
  }else if(imageMode==="clear"){
    await apiPost("imageClear",{id:x.id});
  }
  for(let i=0;i<10;i++){
    await sleep(450);
    const list=await apiGetEntries();
    const found=list.find(e=>e.id===x.id&&Number(e.updatedAt)>=Number(x.updatedAt));
    const imageOk=imageMode==="replace"?!!found?.hasImage:imageMode==="clear"?!found?.hasImage:true;
    if(found&&imageOk)return found;
  }
  throw new Error(imageMode==="replace"?"사진 저장 확인에 실패했어요":"저장 확인에 실패했어요");
}
async function apiDeleteEntry(id){await apiPost("delete",{id});for(let i=0;i<7;i++){await sleep(450);const list=await apiGetEntries();if(!list.some(e=>e.id===id))return true}throw new Error("삭제 확인에 실패했어요")}

  if(!e||!e.hasImage)return Promise.resolve("");
  if(e.image)return Promise.resolve(e.image);
  if(imageLoads.has(e.id))return imageLoads.get(e.id);
  const p=apiGetImage(e.id).then(img=>{e.image=img||"";e.hasImage=!!img;imageLoads.delete(e.id);return e.image}).catch(err=>{imageLoads.delete(e.id);throw err});

  r.sourceSearch.classList.toggle("show",searchable);
  r.ibox.classList.remove("hidden");
  if(sourceType==="photo"){r.ihint.textContent="+";r.sourceSearch.classList.remove("show")}
  if(searchable){
    const copy={book:"책 제목이나 저자 검색",movie:"영화 제목 검색",music:"아티스트·앨범·곡 검색",exhibition:"전시명·작가·기관 검색",place:"공간·장소 이름 검색"};
    r.sourceQuery.placeholder=copy[sourceType];
    r.sourceHelp.textContent="외부 데이터베이스 연결 전 테스트 화면입니다. 검색 결과에서 표지·포스터·이미지를 가져오도록 연결할 예정이에요.";
    r.sourceMeta.textContent=sourceData?`${sourceLabel(sourceType)} · ${sourceData.title||"선택됨"}`:"";
    r.ihint.textContent="또는 내 이미지 추가";
  } else {r.sourceHelp.textContent="";r.sourceMeta.textContent=""}
}
function setSource(type){
  sourceType=type;sourceData=null;r.sourceQuery.value="";
  updateSourceUI();
}
function openEditor(id=null){editingId=id;pendingImage="";selectedTags=[];sourceType="photo";sourceData=null;imageDirty=false;editingHadImage=false;r.title.value="";r.body.value="";r.catInput.value="";r.edel.classList.add("hidden");let entry=null;if(id){entry=entries.find(x=>x.id===id);if(!entry)return;r.editorTitle.textContent="기록 수정";r.title.value=entry.title||"";r.body.value=entry.body||"";selectedTags=[...entryTags(entry)];pendingImage=entry.image||"";editingHadImage=!!(entry.image||entry.hasImage);sourceType=entry.sourceType==="none"?"photo":(entry.sourceType||"photo");sourceData=entry.sourceData||null;r.edel.classList.remove("hidden")}else r.editorTitle.textContent="새 기록";updatePreview();updateSourceUI();renderCategorySelected();renderSuggestions();r.editor.classList.remove("hidden");r.editor.scrollTop=0;document.body.style.overflow="hidden";if(entry&&editingHadImage&&!pendingImage)loadEntryImage(entry).then(img=>{if(editingId===id&&!imageDirty&&img){pendingImage=img;updatePreview()}}).catch(()=>{})}
function closeEditor(){r.editor.classList.add("hidden");editingId=null;pendingImage="";selectedTags=[];sourceType="photo";sourceData=null;imageDirty=false;editingHadImage=false;r.iinput.value="";document.body.style.overflow=r.detail.classList.contains("hidden")?"":"hidden"}
async function save(){const title=r.title.value.trim(),body=r.body.value.trim();const typed=r.catInput.value.trim();if(typed&&!selectedTags.includes(typed))selectedTags=[...selectedTags,typed];const tags=selectedTags.length?[...selectedTags]:["미분류"];if(!title){toast("제목을 적어주세요");r.title.focus();return}const old=editingId?entries.find(e=>e.id===editingId):null,now=Date.now();const imageMode=old?(imageDirty?(pendingImage?"replace":"clear"):"keep"):(pendingImage?"replace":"clear");const e={id:old?.id||uid(),title,body,tags,category:tags[0]||"미분류",image:pendingImage||"",sourceType,sourceData,createdAt:old?.createdAt||now,updatedAt:now};r.save.disabled=true;try{await put(e,imageMode);if(old&&!imageDirty&&old.image)e.image=old.image;closeEditor();await refresh();if(detailId===e.id){closeDetail();openDetail(e.id)}toast(storageMode==="memory"?"미리보기 저장됨 · 새로고침하면 사라져요":storageMode==="remote"?(old?"구글에 수정했어요":"구글에 저장했어요"):(old?"수정했어요":"저장했어요"))}catch(err){console.error(err);toast("저장하지 못했어요")}finally{r.save.disabled=false}}
async function remove(id){if(!id||!confirm("이 기록을 삭제할까요?"))return;await del(id);closeEditor();closeDetail();await refresh();toast("삭제했어요")}
r.add.onclick=()=>openEditor();r.emptyAdd.onclick=()=>openEditor();r.gmode.onclick=()=>{view="gallery";r.gmode.classList.add("active");r.bmode.classList.remove("active");renderContent()};r.bmode.onclick=()=>{view="board";r.bmode.classList.add("active");r.gmode.classList.remove("active");renderContent()};r.back.onclick=closeDetail;r.edit.onclick=()=>detailId&&openEditor(detailId);r.ddel.onclick=()=>remove(detailId);r.cancel.onclick=closeEditor;r.save.onclick=save;r.edel.onclick=()=>remove(editingId);r.ibox.onclick=e=>{if(e.target!==r.iremove)r.iinput.click()};r.iinput.onchange=async()=>{const f=r.iinput.files?.[0];if(!f)return;try{pendingImage=await resize(f);imageDirty=true;updatePreview()}catch{toast("이미지를 불러오지 못했어요")}};r.iremove.onclick=e=>{e.stopPropagation();pendingImage="";imageDirty=true;r.iinput.value="";updatePreview()};r.addCat.onclick=createCategoryFromInput;r.catInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();createCategoryFromInput()}};r.sourceTabs.addEventListener("click",e=>{const b=e.target.closest("button[data-source]");if(b)setSource(b.dataset.source)});r.sourceSearchBtn.onclick=()=>{toast("데이터베이스 연결은 다음 단계에서 붙일게요")};r.sourceQuery.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();r.sourceSearchBtn.click()}};
function showAppLoading(){lockScreen.classList.add("hidden");r.empty.classList.add("hidden");r.gallery.innerHTML="";r.board.innerHTML="";r.count.textContent="불러오는 중…"}
function returnToLock(message){localStorage.removeItem(PIN_KEY);apiPin="";entries=[];lockScreen.classList.remove("hidden");lockMsg.textContent=message||"PIN을 다시 입력해주세요";pinInput.value="";setTimeout(()=>pinInput.focus(),80)}
async function loadArchiveAfterUnlock(){try{await refresh();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAllTextCards)}catch(err){returnToLock(err.message||"PIN을 다시 입력해주세요")}}
async function unlock(){const pin=pinInput.value.trim();if(!pin){lockMsg.textContent="PIN을 입력해주세요";return}pinBtn.disabled=true;lockMsg.textContent="확인 중…";apiPin=pin;try{await apiAuth();localStorage.setItem(PIN_KEY,pin);lockMsg.textContent="";showAppLoading();loadArchiveAfterUnlock()}catch(err){apiPin="";localStorage.removeItem(PIN_KEY);lockMsg.textContent=err.message||"PIN을 확인해주세요"}finally{pinBtn.disabled=false}}
pinBtn.onclick=unlock;pinInput.onkeydown=e=>{if(e.key==="Enter")unlock()};
async function boot(){if(apiPin){pinInput.value=apiPin;showAppLoading();loadArchiveAfterUnlock();return}lockScreen.classList.remove("hidden");setTimeout(()=>pinInput.focus(),80)}
boot();let fitTimer;window.addEventListener("resize",()=>{clearTimeout(fitTimer);fitTimer=setTimeout(fitAllTextCards,120)});
})();
</script>
